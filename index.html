<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Wednesday Cash League – Ottawa Curling Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap">
<style>
:root{
  --navy:#2b3743; --navy-d:#1f2830; --red:#963b33; --red-d:#7c2f29;
  --bg:#f2f4f7; --surface:#ffffff; --text:#1c2733; --muted:#5d6b7b; --line:#dbe1e8;
  --row-alt:#f7f9fb; --ok:#1d7a46; --warn:#a15c00; --bad-bg:#fdecec; --ok-bg:#e8f5ee; --chip:#e9eef5;
  --link:#12294d; --input-bg:#ffffff; --shadow:0 1px 3px rgba(10,25,50,.12);
  --head-bg:#ffffff; --top-bg:#0b1a33; --top-text:#e7edf5;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1622; --surface:#162231; --text:#e8edf3; --muted:#9aa8b8; --line:#2a3b4f;
    --row-alt:#1a2839; --bad-bg:#3a1c20; --ok-bg:#16301f; --chip:#22334a; --link:#9cc0f5;
    --input-bg:#0f1b2a; --head-bg:#11202f; --top-bg:#070f1c; --shadow:0 1px 3px rgba(0,0,0,.5);
    --red:#d2434c; --ok:#58c485; --warn:#e0a24a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1622; --surface:#162231; --text:#e8edf3; --muted:#9aa8b8; --line:#2a3b4f;
  --row-alt:#1a2839; --bad-bg:#3a1c20; --ok-bg:#16301f; --chip:#22334a; --link:#9cc0f5;
  --input-bg:#0f1b2a; --head-bg:#11202f; --top-bg:#070f1c; --shadow:0 1px 3px rgba(0,0,0,.5);
  --red:#d2434c; --ok:#58c485; --warn:#e0a24a; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 "Open Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--link)}
h1,h2,h3{font-family:"Montserrat","Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.2;margin:0}
.wrap{max-width:1140px;margin:0 auto;padding:0 18px}

/* top bar + header */
.topbar{background:var(--top-bg);color:var(--top-text);font-size:13px}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:7px;padding-bottom:7px;flex-wrap:wrap}
.topbar a{color:var(--top-text);text-decoration:none}
.topbar a:hover{text-decoration:underline}
header.site{background:var(--head-bg);border-bottom:3px solid var(--red);box-shadow:var(--shadow)}
header.site .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:78px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text)}
.brand svg{width:56px;height:56px;flex:none}
.brand b{display:block;font-family:"Montserrat","Segoe UI",Arial,sans-serif;font-size:20px;letter-spacing:.2px;color:var(--navy)}
.brand small{display:block;color:var(--muted);font-size:12px;letter-spacing:1px;text-transform:uppercase}
:root[data-theme="dark"] .brand b{color:var(--text)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand b{color:var(--text)}}
nav.main ul{list-style:none;margin:0;padding:0;display:flex;gap:2px}
nav.main li{position:relative}
nav.main a{display:block;padding:10px 14px;color:var(--text);text-decoration:none;font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.4px;border-radius:3px}
nav.main li:hover>a,nav.main li:focus-within>a,nav.main a.cur{color:var(--red)}
nav.main ul ul{display:none;position:absolute;right:0;top:100%;min-width:230px;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--red);box-shadow:0 6px 16px rgba(0,0,0,.18);z-index:30;flex-direction:column;gap:0;padding:4px 0}
nav.main li:hover>ul,nav.main li:focus-within>ul{display:flex}
nav.main ul ul a{text-transform:none;font-weight:500;font-size:14px;letter-spacing:0;border-radius:0}
nav.main ul ul a:hover{background:var(--row-alt)}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:4px;color:var(--text);font-size:22px;line-height:1;padding:6px 11px;cursor:pointer}
@media (max-width:860px){
  .burger{display:block}
  nav.main{display:none;position:absolute;left:0;right:0;top:100%;background:var(--surface);border-bottom:3px solid var(--red);z-index:40;max-height:75vh;overflow:auto}
  nav.main.open{display:block}
  header.site{position:relative}
  nav.main ul{flex-direction:column;padding:8px 18px}
  nav.main ul ul{display:flex;position:static;border:0;box-shadow:none;padding:0 0 0 14px;min-width:0}
}

/* hero */
.hero{background:linear-gradient(135deg,#963b33 0%,#7c2f29 100%);color:#fff;position:relative;overflow:hidden}
.hero .wrap{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:12px 32px;padding-top:0;padding-bottom:0;z-index:1}
.hero .htext{flex:1 1 260px;padding:18px 0}
.hero svg.rings{position:absolute;right:-70px;top:50%;transform:translateY(-50%);width:420px;height:420px;opacity:.28}
.hero .logo{display:block;flex:none;height:128px;width:auto;max-width:100%;margin:0}
.hero .kicker{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#cfdcf0;font-weight:600}
.hero h1{font-size:clamp(28px,5vw,46px);margin:8px 0 10px;font-weight:800}
.hero p{margin:0;max-width:560px;color:#dce6f5}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{display:inline-block;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:4px 12px;font-size:13px}

/* tabs */
.tabs{background:var(--surface);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;flex-wrap:wrap;gap:0 4px}
.tabs a{font-family:"Montserrat","Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:14px 18px;text-decoration:none;color:var(--muted);font-weight:700;font-size:14px;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a:hover{color:var(--text)}
.tabs a.cur{color:var(--red);border-bottom-color:var(--red)}

main{padding:26px 0 46px;min-height:50vh}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);margin-bottom:22px}
.card>.hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card>.hd h2{font-size:20px;color:var(--navy)}
:root[data-theme="dark"] .card>.hd h2{color:var(--text)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .card>.hd h2{color:var(--text)}}
.card>.bd{padding:18px}
.sub{color:var(--muted);font-size:14px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:var(--navy);color:#fff;font-size:12px;text-transform:uppercase;letter-spacing:.6px;white-space:nowrap}
:root[data-theme="dark"] th{background:#0c1a31}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) th{background:#0c1a31}}
tbody tr:nth-child(even){background:var(--row-alt)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.pts{font-weight:800}
.rank{font-weight:800;width:44px}
.top3 .rank{color:var(--red)}
.team b{font-weight:700}
.team small{display:block;color:var(--muted);font-size:12px}

/* schedule grid */
.grid th.dr,.grid td.dr{background:var(--chip);color:var(--text);font-weight:700;white-space:nowrap;min-width:92px}
.grid td{min-width:150px;font-size:14px;text-align:center;border-left:1px solid var(--line)}
.grid .tm{display:block;font-weight:600}
.grid .vs{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px}
.grid .sc{display:inline-block;margin-top:4px;background:var(--ok-bg);color:var(--ok);border-radius:4px;padding:1px 8px;font-weight:700;font-size:13px}
.empty-cell{color:var(--muted)}
.bye{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.bye span{background:var(--chip);border-radius:999px;padding:3px 11px;font-size:13px}

/* forms */
label{display:block;font-weight:600;font-size:13px;margin-bottom:4px}
input,select,textarea{font:inherit;color:var(--text);background:var(--input-bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%;max-width:100%}
input:focus,select:focus{outline:2px solid var(--navy);outline-offset:1px;border-color:var(--navy)}
:root[data-theme="dark"] input:focus,:root[data-theme="dark"] select:focus{outline-color:#9cc0f5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) input:focus,:root:not([data-theme="light"]) select:focus{outline-color:#9cc0f5}}
.row{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.btn{display:inline-block;background:var(--red);color:#fff;border:0;border-radius:4px;padding:10px 20px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--red-d)}
.btn.sec{background:var(--navy);}
.btn.sec:hover{background:var(--navy-d)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--row-alt)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.msg{border-radius:5px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.msg.warn{background:#fff4e0;color:#6b4300;border:1px solid #f0d4a0}
.msg.bad{background:var(--bad-bg);color:#8a1a22;border:1px solid #f1b9bd}
.msg.ok{background:var(--ok-bg);color:var(--ok);border:1px solid #b6dfc6}
:root[data-theme="dark"] .msg.warn{background:#3a2d12;color:#f0cf93;border-color:#5a4520}
:root[data-theme="dark"] .msg.bad{color:#f4b8bd;border-color:#6a2a30}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .msg.warn{background:#3a2d12;color:#f0cf93;border-color:#5a4520}:root:not([data-theme="light"]) .msg.bad{color:#f4b8bd;border-color:#6a2a30}}
.scorebox{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:end;margin-top:12px}
.scorebox input{font-size:28px;font-weight:800;text-align:center;padding:10px}
.scorebox .dash{font-size:24px;color:var(--muted);padding-bottom:12px}
.gamecard{border:1px solid var(--line);border-radius:6px;padding:16px;background:var(--row-alt)}
.gamecard .where{color:var(--muted);font-size:14px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:2px 8px}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.pend{background:var(--chip);color:var(--muted)}
.tag.lock{background:#fff4e0;color:var(--warn)}
:root[data-theme="dark"] .tag.lock{background:#3a2d12}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.lock{background:#3a2d12}}
.sub-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.sub-tabs button{background:var(--chip);color:var(--text);border:0;border-radius:4px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.sub-tabs button.cur{background:var(--navy);color:#fff}
tr.bad td{background:var(--bad-bg)}
td.edit input,td.edit select{padding:6px 8px;min-width:110px}
td.edit input.sc{min-width:64px;width:72px;text-align:center}
.login{max-width:380px;margin:0 auto}

/* footer */
footer.site{background:var(--navy-d);color:#cdd8e8;font-size:14px}
:root[data-theme="dark"] footer.site{background:#070f1c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) footer.site{background:#070f1c}}
footer.site .wrap{padding-top:30px;padding-bottom:26px;display:grid;gap:26px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
footer.site h3{color:#fff;font-size:14px;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
footer.site a{color:#cdd8e8}
footer.site .legal{grid-column:1/-1;border-top:1px solid rgba(255,255,255,.15);padding-top:14px;font-size:12px;color:#9fb0c8}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#0b1a33;color:#fff;padding:11px 18px;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.35);z-index:99;max-width:90vw;display:none;font-size:14px}
@media (max-width:560px){
  .hero svg.rings{width:300px;height:300px;right:-110px}
  th,td{padding:8px 7px}
  .hide-s{display:none}
}
.win{font-weight:800;color:var(--ok)}
.ph{color:var(--muted);font-style:italic}
tr.grp td{background:var(--red);color:#fff;font-weight:800;font-size:17px;text-transform:uppercase;letter-spacing:.8px;padding:11px 10px}
.grid2 td .sc{display:inline-block;background:var(--ok-bg);color:var(--ok);border-radius:4px;padding:1px 8px;font-weight:700;font-size:13px}
td .sc{display:inline-block;background:var(--ok-bg);color:var(--ok);border-radius:4px;padding:1px 8px;font-weight:700;font-size:13px}
td.edit input.sc{background:var(--input-bg);color:var(--text);padding:6px 8px}
label.radio{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;padding:4px 0}
label.radio input{width:auto}
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.linkbtn{background:none;border:0;color:var(--link);text-decoration:underline;cursor:pointer;font:inherit;padding:0}
.sched,.sched th,.sched td,.sched td.n,.sched th.n,.sched .bd{text-align:center}
.sched>.hd{flex-direction:column;justify-content:center;text-align:center}
.sched>.hd>div{text-align:center}
.sched .bye{justify-content:center}
.ctr,.ctr th,.ctr td,.ctr td.n,.ctr th.n,.ctr .bd{text-align:center}
.ctr>.hd{flex-direction:column;justify-content:center;text-align:center}
.ctr tbody td{background:var(--navy);color:#fff;border-bottom-color:rgba(255,255,255,.14)}
.ctr tbody tr:nth-child(even) td{background:#364351}
.ctr th{background:var(--red)}
.ctr .top3 .rank{color:#fff}
.ctr .team small,.ctr .sub,.ctr .ph{color:#c9d3df}
.ctr .win{color:#7fe3a9}
.ctr td .sc{background:rgba(127,227,169,.18);color:#7fe3a9}
.ctr .tag.lock{background:#4a3a14;color:#f3cf8c}
</style>
</head>

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const gid = n => "g"+String(n).padStart(3,"0");
const money = n => "$"+(Number(n)||0).toLocaleString("en-CA",{minimumFractionDigits:Number.isInteger(Number(n)||0)?0:2});
const tmin = t => { const m=/(\d+):(\d+)\s*(AM|PM)/i.exec(t||""); if(!m) return 0; let h=(+m[1])%12; if(/PM/i.test(m[3])) h+=12; return h*60+ +m[2]; };
function parseD(s){ const p=String(s).split("-").map(Number); return new Date(p[0],(p[1]||1)-1,p[2]||1); }
const fmtLong = d => d.toLocaleDateString("en-CA",{weekday:"long",month:"long",day:"numeric",year:"numeric"});
const fmtShort = d => d.toLocaleDateString("en-CA",{month:"short",day:"numeric"});
function todayMid(){ const t=new Date(); return new Date(t.getFullYear(),t.getMonth(),t.getDate()); }
let toastTimer;
function toast(m){ const t=$("#toast"); t.textContent=m; t.style.display="block"; clearTimeout(toastTimer); toastTimer=setTimeout(()=>{t.style.display="none"},4500); }
function getToken(){ try{ return sessionStorage.getItem("occ_cash_token")||""; }catch(e){ return ""; } }
function setToken(v){ try{ v?sessionStorage.setItem("occ_cash_token",v):sessionStorage.removeItem("occ_cash_token"); }catch(e){} }

/* ---------- state ---------- */
const S = {
  pending:false, loaded:false, loadErr:"", setup:API_URL.indexOf("PASTE_")===0,
  raw:{cfg:null,teams:{},games:{},results:{}},
  cfg:{...DEFAULT_CFG}, teams:{}, games:{}, results:{},
  schedWeek:null, reportWeek:null, reportTeam:"",
  token:getToken(), admin:!!getToken(), adminTab:"season", editWeek:null, editRows:null, adminResWeek:null,
  loginErr:"", pwMsg:null, loginInfo:"", resetToken:(new URLSearchParams(location.search)).get("reset")||"", busy:false
};
const ready = () => S.loaded;
function recompute(){
  S.cfg={...DEFAULT_CFG,...(S.raw.cfg||{})}; S.teams=S.raw.teams; S.games=S.raw.games; S.results=S.raw.results;
  S.weekDates={}; Object.values(S.games).forEach(g=>{ if(g.date) S.weekDates[g.week]=g.date; });
  const maxWeek=Math.max(0,...Object.values(S.games).map(g=>g.week)); if(maxWeek>S.cfg.weeks) S.cfg.weeks=maxWeek;
}
recompute();

/* ---------- derived ---------- */
function weekDate(w){ if(S.weekDates&&S.weekDates[w]) return parseD(S.weekDates[w]); const d=parseD(S.cfg.startDate); d.setDate(d.getDate()+7*(w-1)); return d; }
function etDate8(){
  /* current date in Ottawa/Toronto time, shifted back 8 hours so the week flips at 8:00 AM Eastern on Thursday */
  const p={}; new Intl.DateTimeFormat("en-CA",{timeZone:"America/Toronto",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date()).forEach(x=>{ p[x.type]=x.value; });
  const t=new Date(+p.year,+p.month-1,+p.day,(+p.hour)%24,+p.minute); t.setHours(t.getHours()-8);
  return new Date(t.getFullYear(),t.getMonth(),t.getDate());
}
function defaultSchedWeek(){
  /* next week's draw shows at 8:00 AM Eastern on Thursday, or as soon as every game of the current week has a result – whichever comes first */
  const t=etDate8(); let w=S.cfg.weeks;
  for(let i=1;i<=S.cfg.weeks;i++){ if(weekDate(i)>=t){ w=i; break; } }
  while(w<S.cfg.weeks){ const gs=gamesFor(w); if(gs.length&&gs.every(g=>winnerOf(g))) w++; else break; }
  return w;
}
function defaultPastWeek(){ const t=todayMid(); let r=1; for(let w=1;w<=S.cfg.weeks;w++){ if(weekDate(w)<=t) r=w; } return r; }
function defaultReportWeek(){
  /* stay on the latest week whose Wednesday has arrived until all its games have results; then move on */
  const t=todayMid(); let c=1;
  for(let w=1;w<=S.cfg.weeks;w++){ if(weekDate(w)<=t) c=w; }
  while(c<S.cfg.weeks){ const gs=gamesFor(c); if(gs.length&&gs.every(g=>winnerOf(g))) c++; else break; }
  return c;
}
const schedW = () => S.schedWeek ?? defaultSchedWeek();
const reportW = () => S.reportWeek ?? defaultReportWeek();
const teamList = () => Object.values(S.teams).sort((a,b)=>(a.order??999)-(b.order??999)||String(a.name).localeCompare(String(b.name)));
const tn = id => S.teams[id] ? S.teams[id].name : "—";
const gamesFor = w => Object.values(S.games).filter(g=>g.week===w).sort((a,b)=>a.num-b.num);
const winnerOf = g => (S.results[g.id]&&S.results[g.id].winner)||"";
// the two sides of a game: explicit teams, or filled in from the games that feed it
function slots(g,depth){
  depth=depth||0;
  const res=[g.a?{id:g.a}:null, g.b?{id:g.b}:null];
  if(res[0]&&res[1]) return res;
  const feeders=Object.values(S.games).filter(f=>f.wTo===g.num||f.lTo===g.num).sort((x,y)=>x.num-y.num);
  const q=feeders.map(f=>{
    const win=f.wTo===g.num, w=winnerOf(f);
    if(w){
      if(win) return {id:w};
      const pp=depth<12?slots(f,depth+1):[]; const other=pp.find(p=>p&&p.id&&p.id!==w);
      if(other) return other;
    }
    return {ph:(win?"Winner":"Loser")+" from Game "+f.num};
  });
  return res.map(s=>s||q.shift()||{ph:"TBD"});
}
const slotHTML = (s,win) => s.id ? `<span class="${win?"win":""}">${win?"✓ ":""}${esc(tn(s.id))}</span>` : `<span class="ph">${esc(s.ph)}</span>`;
const bothKnown = sl => sl[0].id && sl[1].id;

function standings(){
  const r={};
  teamList().forEach(t=>r[t.id]={id:t.id,name:t.name,gp:0,w:0,l:0,so:0,won:0});
  Object.values(S.games).forEach(g=>{
    const w=winnerOf(g); if(!w||!r[w]) return;
    const sl=slots(g), ids=sl.map(s=>s.id).filter(Boolean), lo=ids.find(i=>i!==w);
    const val=Number(g.value)||0, so=!!S.results[g.id].so;
    r[w].gp++; r[w].w++; r[w].won+=so?val/2:val; if(so) r[w].so++;
    if(lo&&r[lo]){ r[lo].gp++; r[lo].l++; if(so) r[lo].won+=val/2; }
  });
  return Object.values(r).sort((a,b)=>b.won-a.won||b.w-a.w||a.l-b.l||a.name.localeCompare(b.name));
}

/* ---------- chrome ---------- */
function buildNav(){
  $("#navlist").innerHTML = NAV.map(n=>{
    const sub = n.k ? "<ul>"+n.k.map(k=>`<li><a href="${BASE}${k[1]}" target="_blank" rel="noopener">${esc(k[0])}</a></li>`).join("")+"</ul>" : "";
    const ext = n.u.startsWith("http");
    return `<li><a href="${n.u}" ${ext?'target="_blank" rel="noopener"':'data-noop="1"'}>${esc(n.t)}</a>${sub}</li>`;
  }).join("");
  $("#navlist").addEventListener("click",e=>{ const a=e.target.closest("a[data-noop]"); if(a) e.preventDefault(); });
  $("#burger").addEventListener("click",()=>{ const o=$("#mainnav").classList.toggle("open"); $("#burger").setAttribute("aria-expanded",o); });
}
function curView(){ const h=location.hash.slice(1); return VIEWS.some(v=>v[0]===h)?h:"standings"; }
function renderChrome(){
  const cv=curView();
  $("#tabs").innerHTML = VIEWS.map(v=>`<a href="#${v[0]}" class="${v[0]===cv?"cur":""}">${v[1]}${v[0]==="admin"&&S.admin?" ✓":""}</a>`).join("");
  $("#heroTitle").textContent = S.cfg.name || "Wednesday Cash League";
  $("#heroMeta").innerHTML = [`Season ${esc(S.cfg.season)}`,`${Object.keys(S.teams).length} teams`].map(c=>`<span class="chip">${c}</span>`).join("");
}

/* ---------- views ---------- */
function banner(){
  if(S.setup) return `<div class="msg warn"><b>Setup needed.</b> This page isn’t connected to the Google Sheet yet. Paste the Apps Script web app URL into the API_URL setting at the top of the page’s script.</div>`;
  if(S.loadErr) return `<div class="msg warn">Couldn’t reach the league data (${esc(S.loadErr)}). What you see may be out of date.</div>`;
  return "";
}
function weekOptions(sel){
  let o=""; for(let w=1;w<=S.cfg.weeks;w++) o+=`<option value="${w}" ${w===sel?"selected":""}>Week ${w} – ${esc(fmtShort(weekDate(w)))}</option>`; return o;
}
function viewStandings(){
  if(!ready()) return banner()+`<div class="card"><div class="bd">Loading standings…</div></div>`;
  const rows=standings();
  const decided=Object.values(S.games).filter(g=>winnerOf(g));
  const wks=[...new Set(decided.map(g=>g.week))].sort((a,b)=>a-b), lastW=wks.length?wks[wks.length-1]:null;
  const body=rows.map((t,i)=>`<tr class="${i<3&&t.gp?"top3":""}"><td class="rank">${i+1}</td><td class="team"><b>${esc(t.name)}</b></td>
    <td class="n">${t.gp}</td><td class="n">${t.w}</td><td class="n">${t.l}</td><td class="n hide-s">${t.so}</td><td class="n pts">${money(t.won)}</td></tr>`).join("");
  let latest="";
  if(lastW){
    const gs=gamesFor(lastW);
    latest=`<div class="card ctr"><div class="hd"><h2>Week ${lastW} results</h2><span class="sub">${esc(fmtLong(weekDate(lastW)))}</span></div><div class="scroll"><table>
      <thead><tr><th>Game</th><th>Time</th><th>Matchup</th><th class="n">Value</th></tr></thead><tbody>${gs.map(g=>matchRow(g,true)).join("")}</tbody></table></div></div>`;
  }
  return banner()+`<div class="card ctr"><div class="hd"><h2>Leaderboard</h2><span class="sub">${lastW?`Through week ${lastW} · `:""}Winners collect the game value · shootout games are split evenly</span></div>
    <div class="scroll"><table><thead><tr><th>#</th><th>Team</th><th class="n">GP</th><th class="n">W</th><th class="n">L</th><th class="n hide-s">SO W</th><th class="n">Winnings</th></tr></thead><tbody>${body}</tbody></table></div>
    ${decided.length?"":`<div class="bd sub">No results yet.</div>`}</div>${latest}`;
}
function matchRow(g,compact){
  const sl=slots(g), w=winnerOf(g), r=S.results[g.id]||{};
  let score="";
  if(r.sw!=null&&r.sl!=null&&w&&sl[0].id&&sl[1].id){ const s0=w===sl[0].id?r.sw:r.sl, s1=w===sl[1].id?r.sw:r.sl; score=` <span class="sc">${s0} – ${s1}</span>`; }
  const m=`${slotHTML(sl[0],w&&sl[0].id===w)} <span class="sub">vs</span> ${slotHTML(sl[1],w&&sl[1].id===w)}${r.so?` <span class="tag lock">SO</span>`:""}${score}${w&&r.locked&&!compact?` <span class="tag lock">Final</span>`:""}`;
  if(compact) return `<tr><td>${g.num}</td><td>${esc(g.time)}</td><td>${m}</td><td class="n">${money(g.value)}</td></tr>`;
  return `<tr><td>${g.num}</td><td>${g.sheet||""}</td><td>${m}</td><td class="n">${money(g.value)}</td>
    <td class="hide-s sub">Winner to Game ${g.wTo||"—"}<br>Loser to Game ${g.lTo||"—"}</td></tr>`;
}
function viewSchedule(){
  if(!ready()) return banner()+`<div class="card"><div class="bd">Loading schedule…</div></div>`;
  const w=schedW(), gs=gamesFor(w), isNext=w===defaultSchedWeek();
  let grid="";
  if(!gs.length) grid=`<div class="bd"><p>The draw for this week hasn’t been posted yet.</p></div>`;
  else {
    const times=[...new Set(gs.map(g=>g.time))].sort((a,b)=>tmin(a)-tmin(b));
    const body=times.map(t=>`<tr class="grp"><td colspan="5">${esc(t)} draw</td></tr>`+gs.filter(g=>g.time===t).map(g=>matchRow(g,false)).join("")).join("");
    grid=`<div class="scroll"><table class="grid2"><thead><tr><th>Game</th><th>Sheet</th><th>Matchup</th><th class="n">Value</th><th class="hide-s">Advances</th></tr></thead><tbody>${body}</tbody></table></div>`;
  }
  return banner()+`<div class="card sched"><div class="hd"><div><h2>${isNext?(weekDate(w)>todayMid()?"Next week’s schedule":"This week’s schedule"):"Weekly schedule"}</h2><div class="sub">${esc(fmtLong(weekDate(w)))}</div></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn ghost sm" data-act="sched-prev" ${w<=1?"disabled":""}>← Prev</button>
    <select data-bind="schedWeek" style="width:auto">${weekOptions(w)}</select><button class="btn ghost sm" data-act="sched-next" ${w>=S.cfg.weeks?"disabled":""}>Next →</button></div></div>${grid}</div>`;
}
function viewReport(){
  if(!ready()) return banner()+`<div class="card"><div class="bd">Loading…</div></div>`;
  const w=reportW(), gs=gamesFor(w), pending=S.admin?gs:gs.filter(g=>!winnerOf(g));
  let body;
  if(!gs.length) body=`<div class="msg warn">No draw has been posted for week ${w} yet.</div>`;
  else if(!pending.length) body=`<div class="msg ok">All results for week ${w} have been reported. Thank you! If one needs correcting, please contact the league admin.</div>`;
  else body=`<div class="cards">`+pending.map(g=>{
    const sl=slots(g);
    const head=`<div><b>Game ${g.num}</b> · ${esc(g.time)}${g.sheet?" · Sheet "+g.sheet:""} · ${money(g.value)}</div>`;
    if(!bothKnown(sl)) return `<div class="gamecard">${head}<div class="where">${slotHTML(sl[0])} <span class="sub">vs</span> ${slotHTML(sl[1])}<br>Opponents aren’t decided yet.</div></div>`;
    const cur=winnerOf(g), r=S.results[g.id]||{};
    return `<div class="gamecard">${head}
      ${cur?`<div style="margin-top:6px"><span class="tag ok">Reported</span> <span class="sub">Winner: ${esc(tn(cur))}${r.so?" · shootout":""}</span></div>`:""}
      <div style="margin-top:10px">${sl.map(s=>`<label class="radio"><input type="radio" name="win-${g.id}" value="${esc(s.id)}" ${cur===s.id?"checked":""}> ${esc(tn(s.id))}</label>`).join("")}</div>
      <label class="radio" style="margin-top:4px"><input type="checkbox" id="so-${g.id}" ${r.so?"checked":""}> Went to a shootout (SO)</label>
      <div class="actions"><button class="btn" data-act="submit-result" data-gid="${esc(g.id)}" ${S.busy?"disabled":""}>${cur?"Update result":"Submit result"}</button>
      ${cur&&S.admin?`<button class="btn ghost sm" data-act="clear-result" data-gid="${esc(g.id)}">Clear result</button>`:""}</div></div>`;
  }).join("")+`</div>`;
  return banner()+`<div class="card"><div class="hd"><h2>Report a score</h2>
    <select data-bind="reportWeek" style="width:auto" aria-label="Week">${weekOptions(w)}</select></div><div class="bd">
    <p class="sub" style="margin-top:0">${S.admin?"You’re signed in as admin, so every game is listed and any result can be changed.":"Only games without a result are listed. Tell us which team won and whether it went to a shootout. Once submitted, a result can only be changed by the league admin."}</p>${body}</div></div>`;
}

  return banner()+nav+(S.adminTab==="season"?adminSeason():S.adminTab==="games"?adminGames():S.adminTab==="password"?adminPassword():adminResults());

    ${teams.map((t,i)=>`<tr><td>${i+1}</td><td class="edit"><input data-team="${esc(t.id)}" value="${esc(t.name)}"></td></tr>`).join("")}</tbody></table></div>
    <div class="bd"><button class="btn" data-act="save-teams">Save teams</button></div></div>`;

function ensureEdit(){
  if(S.editWeek==null) S.editWeek=defaultSchedWeek();
  if(S.editRows==null) S.editRows=gamesFor(S.editWeek).map(g=>({num:g.num,time:g.time,sheet:g.sheet||0,a:g.a||"",b:g.b||"",value:g.value,wTo:g.wTo||"",lTo:g.lTo||""}));
}
function validateRows(rows,w){
  const bad={}, notes=[]; const mark=(i,m)=>{bad[i]=true; if(m&&!notes.includes(m)) notes.push(m);};
  const nums={}, slot={}, team={};
  rows.forEach((r,i)=>{
    if(!(r.num>0)) mark(i,"Every game needs a game number.");
    if(nums[r.num]!==undefined){ mark(i,"Game "+r.num+" appears twice."); mark(nums[r.num]); } else nums[r.num]=i;
    if(Object.values(S.games).some(g=>g.num===r.num&&g.week!==w)) mark(i,"Game "+r.num+" already exists in another week.");
    if(r.sheet>0){ const k=r.time+"-"+r.sheet; if(slot[k]!==undefined){ mark(i,"Two games share a sheet and time."); mark(slot[k]); } else slot[k]=i; }
    if(r.a&&r.a===r.b) mark(i,"A team can’t play itself.");
    [r.a,r.b].forEach(t=>{ if(!t) return; if(team[t]!==undefined){ mark(i,tn(t)+" is in two games."); mark(team[t]); } else team[t]=i; });
  });
  return {bad,notes};
}

  const w=S.editWeek, rows=S.editRows, v=validateRows(rows,w), teams=teamList();
  const teamOpts=sel=>`<option value="">Auto (from feeder games)</option>`+teams.map(t=>`<option value="${esc(t.id)}" ${t.id===sel?"selected":""}>${esc(t.name)}</option>`).join("");

    <p class="sub" style="margin-top:0">${esc(fmtLong(weekDate(w)))}. Leave teams on “Auto” for games fed by earlier results; set “Winner to / Loser to” to the game each side advances to.</p>

    <div class="scroll"><table><thead><tr><th>Game</th><th>Time</th><th>Sheet</th><th>Team A</th><th>Team B</th><th>$</th><th>Winner to</th><th>Loser to</th><th></th></tr></thead><tbody>
    ${rows.length?rows.map((r,i)=>`<tr class="${v.bad[i]?"bad":""}">
      <td class="edit"><input class="sc" type="number" data-row="${i}" data-f="num" value="${r.num||""}"></td>
      <td class="edit"><select data-row="${i}" data-f="time">${timeOpts(r.time)}</select></td>
      <td class="edit"><select data-row="${i}" data-f="sheet">${sheetOpts(r.sheet)}</select></td>
      <td class="edit"><select data-row="${i}" data-f="a">${teamOpts(r.a)}</select></td>
      <td class="edit"><select data-row="${i}" data-f="b">${teamOpts(r.b)}</select></td>
      <td class="edit"><input class="sc" type="number" data-row="${i}" data-f="value" value="${r.value??""}"></td>
      <td class="edit"><input class="sc" type="number" data-row="${i}" data-f="wTo" value="${r.wTo}"></td>
      <td class="edit"><input class="sc" type="number" data-row="${i}" data-f="lTo" value="${r.lTo}"></td>
      <td><button class="btn ghost sm" data-act="delrow" data-i="${i}" aria-label="Remove game">✕</button></td></tr>`).join(""):`<tr><td colspan="9" class="sub">No games for this week yet.</td></tr>`}
    </tbody></table></div>
    <div class="actions"><button class="btn" data-act="save-games" ${S.busy?"disabled":""}>Save games for week ${w}</button><span class="sub">Changing a game’s teams clears its result.</span></div></div></div>`;

function adminPassword(){
  const m=S.pwMsg;
  return `<div class="card login" style="margin-left:0"><div class="hd"><h2>Change password</h2></div><div class="bd">
    ${m?`<div class="msg ${m.ok?"ok":"bad"}">${esc(m.text)}</div>`:""}
    <div style="margin-bottom:12px"><label for="pw_old">Current password</label><input id="pw_old" type="password" autocomplete="current-password"></div>
    <div style="margin-bottom:12px"><label for="pw_new">New password (at least 8 characters)</label><input id="pw_new" type="password" autocomplete="new-password"></div>
    <div style="margin-bottom:12px"><label for="pw_new2">Confirm new password</label><input id="pw_new2" type="password" autocomplete="new-password"></div>
    <button class="btn" data-act="change-pw" ${S.busy?"disabled":""}>Change password</button></div></div>`;
}
function adminResults(){
  if(S.adminResWeek==null) S.adminResWeek=defaultPastWeek();
  const w=S.adminResWeek, gs=gamesFor(w);
  return `<div class="card"><div class="hd"><h2>Results</h2><select data-bind="adminResWeek" style="width:auto">${weekOptions(w)}</select></div>
    ${gs.length?`<div class="scroll"><table><thead><tr><th>Game</th><th>Matchup / winner</th><th>Shootout</th><th></th></tr></thead><tbody>
    ${gs.map(g=>{const sl=slots(g), r=S.results[g.id]||{}, ok=bothKnown(sl);return `<tr><td>${g.num}<div class="sub">${esc(g.time)}</div></td>
      <td class="edit">${ok?`<select data-rw="${g.id}"><option value="">— no result —</option>${sl.map(s=>`<option value="${esc(s.id)}" ${r.winner===s.id?"selected":""}>${esc(tn(s.id))} won</option>`).join("")}</select>`:`<span class="ph">${esc(sl[0].id?tn(sl[0].id):sl[0].ph)} vs ${esc(sl[1].id?tn(sl[1].id):sl[1].ph)}</span>`}</td>
      <td><input type="checkbox" style="width:auto" data-rso="${g.id}" ${r.so?"checked":""} aria-label="Shootout"></td>
      <td style="white-space:nowrap">${ok?`<button class="btn sm" data-act="save-result" data-gid="${g.id}">Save</button> <button class="btn ghost sm" data-act="clear-result" data-gid="${g.id}">Clear</button>`:""}</td></tr>`}).join("")}
    </tbody></table></div><div class="bd sub">“Final” locks a result so teams can’t change it from the Report a Result page.</div>`:`<div class="bd">No games scheduled for week ${w}.</div>`}</div>`;
}

/* ---------- render ---------- */
function render(){
  S.pending=false; renderChrome();
  const v=curView();
  $("#app").innerHTML = v==="standings"?viewStandings():v==="schedule"?viewSchedule():v==="report"?viewReport():viewAdmin();
}
function safeRender(){
  const a=document.activeElement;
  if(a && $("#app").contains(a) && ["INPUT","SELECT","TEXTAREA"].includes(a.tagName)){ S.pending=true; return; }
  render();
}
document.addEventListener("focusout",()=>{ if(S.pending) setTimeout(()=>{ const a=document.activeElement; if(!(a&&$("#app").contains(a)&&["INPUT","SELECT","TEXTAREA"].includes(a.tagName))) render(); },80); });
window.addEventListener("hashchange",()=>{ render(); window.scrollTo(0,0); });

/* ---------- writes ---------- */
async function apiPost(body){
  const r=await fetch(API_URL,{method:"POST",body:JSON.stringify(body)});
  return r.json();
}
async function guarded(fn,okMsg){
  if(S.setup){ toast("This page isn’t connected to the Google Sheet yet."); return false; }
  S.busy=true;
  try{
    const res=await fn();
    if(!res||!res.ok){
      const e=res&&res.error;
      if(e==="auth"){ setToken(""); S.token=""; S.admin=false; }
      toast({already:"That result has already been reported. Only the admin can change it.",auth:"Your admin session expired. Please sign in again.",bad_winner:"That team isn’t in this game yet.",not_found:"That game wasn’t found."}[e]||"The server didn’t accept that change. Please try again.");
      await load(); return false;
    }
    if(okMsg) toast(okMsg);
    await load(); return true;
  }catch(e){ toast("Couldn’t save – check your connection and try again."); return false; }
  finally{ S.busy=false; render(); }
}
async function act(name,el){
  switch(name){
    case "sched-prev": S.schedWeek=Math.max(1,schedW()-1); render(); break;
    case "sched-next": S.schedWeek=Math.min(S.cfg.weeks,schedW()+1); render(); break;
    case "submit-result": {
      const g=S.games[el.dataset.gid]; if(!g) return;
      if(winnerOf(g)&&!S.admin){ toast("That result has already been reported. Only the admin can change it."); render(); return; }
      const sel=document.querySelector(`input[name="win-${g.id}"]:checked`);
      if(!sel){ toast("Choose which team won."); return; }
      const so=document.getElementById("so-"+g.id).checked;
      await guarded(()=>apiPost({action:S.admin?"setResult":"result",token:S.token,num:g.num,winner:sel.value,so}),S.admin?"Result updated.":"Result saved. Thanks!");
      break; }
    case "forgot-pw": {
      if(S.setup){ toast("This page isn’t connected to the Google Sheet yet."); return; }
      S.loginErr=""; S.loginInfo="";
      try{
        const res=await apiPost({action:"forgot"});
        if(res&&res.ok) S.loginInfo="If an admin email is set up, a reset link has been sent. It works for 30 minutes.";
        else S.loginErr=res&&res.error==="not_configured"?"Password reset isn’t set up yet. Add the ADMIN_RESET_EMAIL and SITE_URL script properties.":"Couldn’t send the reset email. Please try again.";
      }catch(e){ S.loginErr="Couldn’t reach the server. Please try again."; }
      render(); break; }
    case "change-pw": {
      const o=$("#pw_old").value, n1=$("#pw_new").value, n2=$("#pw_new2").value;
      const fail=t=>{ S.pwMsg={ok:false,text:t}; render(); };
      if(!o||!n1||!n2) return fail("Please fill in all three boxes.");
      if(n1!==n2) return fail("The new passwords don’t match.");
      if(n1.length<8) return fail("Please use at least 8 characters.");
      if(n1===o) return fail("The new password must be different from the current one.");
      if(S.setup) return fail("This page isn’t connected to the Google Sheet yet.");
      S.busy=true;
      try{
        const res=await apiPost({action:"changePassword",token:S.token,oldPassword:o,newPassword:n1});
        if(res&&res.ok){ S.token=res.token; setToken(res.token); S.pwMsg={ok:true,text:"Password changed. Use the new password next time you sign in."}; }
        else if(res&&res.error==="auth"){ setToken(""); S.token=""; S.admin=false; S.loginErr="Your admin session expired. Please sign in again."; }
        else S.pwMsg={ok:false,text:res&&res.error==="bad_old"?"The current password is incorrect.":res&&res.error==="weak"?"Please use at least 8 characters.":"Couldn’t change the password. Please try again."};
      }catch(e){ S.pwMsg={ok:false,text:"Couldn’t reach the server. Please try again."}; }
      S.busy=false; render(); break; }
    case "admin-tab": S.adminTab=el.dataset.tab; S.pwMsg=null; render(); break;
    case "logout": setToken(""); S.token=""; S.admin=false; S.loginErr=""; render(); break;
    case "save-config": {
      const weeks=parseInt($("#c_weeks").value,10), sheets=parseInt($("#c_sheets").value,10), start=$("#c_start").value;
      if(!(weeks>=1)||!(sheets>=1)||!start){ toast("Please fill in every setting."); return; }
      await guarded(()=>apiPost({action:"saveConfig",token:S.token,config:{name:$("#c_name").value.trim()||DEFAULT_CFG.name,season:$("#c_season").value.trim(),startDate:start,weeks,sheets}}),"Settings saved."); break; }
    case "save-teams": {
      const list=[]; document.querySelectorAll("[data-team]").forEach(i=>{ const t=S.teams[i.dataset.team]; const v=i.value.trim(); if(t&&v&&v!==t.name) list.push({id:t.id,name:v}); });
      if(!list.length){ toast("No team names changed."); return; }
      await guarded(()=>apiPost({action:"saveTeams",token:S.token,teams:list}),"Teams saved."); break; }
    case "addrow": { const last=S.editRows[S.editRows.length-1]; const mx=Math.max(0,...Object.values(S.games).map(g=>g.num),...S.editRows.map(r=>r.num||0));
      S.editRows.push({num:mx+1,time:last?last.time:"7:00 PM",sheet:0,a:"",b:"",value:20,wTo:"",lTo:""}); render(); break; }
    case "delrow": S.editRows.splice(+el.dataset.i,1); render(); break;
    case "save-games": {
      const w=S.editWeek, rows=S.editRows.slice();
      if(Object.keys(validateRows(rows,w).bad).length){ toast("Fix the highlighted rows first."); return; }
      const ok=await guarded(()=>apiPost({action:"saveGames",token:S.token,week:w,rows:rows.map(r=>({num:r.num,time:r.time,sheet:r.sheet||0,a:r.a||"",b:r.b||"",value:Number(r.value)||0,wTo:Number(r.wTo)||0,lTo:Number(r.lTo)||0}))}),"Games for week "+w+" saved.");
      if(ok){ S.editRows=null; render(); }
      break; }
    case "save-result": {
      const id=el.dataset.gid, g=S.games[id], win=document.querySelector(`[data-rw="${id}"]`).value;
      if(!win){ toast("Pick a winner, or use Clear."); return; }
      await guarded(()=>apiPost({action:"setResult",token:S.token,num:g.num,winner:win,so:document.querySelector(`[data-rso="${id}"]`).checked}),"Result saved."); break; }
    case "clear-result": { const g=S.games[el.dataset.gid]; await guarded(()=>apiPost({action:"setResult",token:S.token,num:g.num,winner:"",so:false}),"Result cleared."); break; }
  }
}
const app=$("#app");
app.addEventListener("click",e=>{ const b=e.target.closest("[data-act]"); if(b&&!b.disabled) act(b.dataset.act,b); });
app.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.bind){
    const k=t.dataset.bind;
    if(k==="schedWeek") S.schedWeek=+t.value; else if(k==="reportWeek") S.reportWeek=+t.value; else if(k==="reportTeam") S.reportTeam=t.value;
    else if(k==="editWeek"){ S.editWeek=+t.value; S.editRows=null; } else if(k==="adminResWeek") S.adminResWeek=+t.value;
    render();
  } else if(t.dataset.row!==undefined){
    const r=S.editRows[+t.dataset.row], f=t.dataset.f;
    if(f==="sheet") r[f]=+t.value; else if(["num","value"].includes(f)) r[f]=t.value===""?"":+t.value;
    else if(["wTo","lTo"].includes(f)) r[f]=t.value===""?"":+t.value; else r[f]=t.value;
    render();
  }
});
app.addEventListener("submit",async e=>{
  const rf=e.target.closest("[data-form='reset']");
  if(rf){
    e.preventDefault();
    const a=rf.np.value, b=rf.np2.value;
    if(a.length<8){ S.loginErr="Please use at least 8 characters."; render(); return; }
    if(a!==b){ S.loginErr="The two passwords don’t match."; render(); return; }
    try{
      const res=await apiPost({action:"reset",token:S.resetToken,password:a});
      if(res&&res.ok){ S.resetToken=""; S.loginErr=""; S.loginInfo="Password updated. Please sign in."; try{ history.replaceState(null,"",location.pathname+"#admin"); }catch(x){} }
      else S.loginErr=res&&res.error==="bad_token"?"That reset link has expired or was already used. Request a new one.":"Couldn’t update the password. Please try again.";
    }catch(err){ S.loginErr="Couldn’t reach the server. Please try again."; }
    render(); return;
  }
  const f=e.target.closest("[data-form='login']"); if(!f) return; e.preventDefault();
  S.loginInfo="";
  if(S.setup){ S.loginErr="This page isn’t connected to the Google Sheet yet."; render(); return; }
  try{
    const res=await apiPost({action:"login",user:f.u.value.trim(),pass:f.p.value});
    if(res&&res.ok){ S.token=res.token; setToken(res.token); S.admin=true; S.loginErr=""; }
    else S.loginErr=res&&res.error==="not_configured"?"Admin login isn’t set up yet. Add the ADMIN_PASSWORD script property.":"Incorrect username or password.";
  }catch(err){ S.loginErr="Couldn’t reach the server. Please try again."; }
  render();
});

/* ---------- data ---------- */
async function load(){
  if(S.setup){ S.loaded=true; return; }
  try{
    const r=await fetch(API_URL+(API_URL.indexOf("?")<0?"?":"&")+"action=data&t="+Date.now());
    const d=await r.json(); if(!d||!d.ok) throw new Error("bad response");
    const teams={}, games={}, results={};
    d.teams.forEach(t=>{ teams[t.id]={id:t.id,name:t.name,order:t.order}; });
    d.games.forEach(g=>{
      const id=gid(g.num);
      games[id]={id,num:g.num,week:g.week,date:g.date,time:g.time,sheet:g.sheet,a:g.a,b:g.b,value:g.value,wTo:g.wTo,lTo:g.lTo};
      if(g.winner) results[id]={id,winner:g.winner,so:!!g.so,locked:!!g.locked,reportedAt:g.reportedAt||0};
    });
    S.raw={cfg:d.config,teams,games,results}; S.loaded=true; S.loadErr=""; recompute();
  }catch(e){ S.loadErr=(e&&e.message)||"network error"; S.loaded=true; }
  safeRender();
}
async function init(){
  render();
  await load();
  if(!S.setup) setInterval(()=>{ if(!document.hidden) load(); },60000);
}
init();
</script>
</body>
